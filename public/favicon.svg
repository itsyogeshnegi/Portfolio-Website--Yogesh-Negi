<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b14" />
      <stop offset="50%" stop-color="#0f1424" />
      <stop offset="100%" stop-color="#06070d" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge Outer -->
  <rect x="28" y="28" width="456" height="456" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />

  <!-- Geometric YN Vector Mark -->
  <g filter="url(#glow)">
    <!-- 'Y' Path -->
    <path d="M 120 150 L 195 270 L 195 365" stroke="url(#neonGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 270 150 L 195 270" stroke="url(#neonGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- 'N' Path -->
    <path d="M 290 365 L 290 150 L 395 365 L 395 150" stroke="url(#neonGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Accent Cyber Dot -->
  <circle cx="410" cy="385" r="18" fill="#38bdf8" />
  <circle cx="410" cy="385" r="8" fill="#ffffff" />
</svg>
