<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="100%" stop-color="#121526" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="18" />

  <!-- YN Initials -->
  <text x="256" y="318" font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="200" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-8">YN</text>

  <!-- Cyber Dot -->
  <circle cx="400" cy="305" r="20" fill="#38bdf8" />
</svg>
